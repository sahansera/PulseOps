name: Feature request
description: Propose a capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Start with the requirement or operational problem, not the technology you want to add.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Keep this as concrete as you can. Alternatives are welcome.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs
      description: What complexity, dependency, latency, maintenance or compatibility cost does this introduce?
  - type: dropdown
    id: milestone
    attributes:
      label: Does this fit the current roadmap?
      options:
        - Yes
        - Not sure
        - No, this is a new direction
    validations:
      required: true
