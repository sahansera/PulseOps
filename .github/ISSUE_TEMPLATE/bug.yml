name: Bug report
description: Report reproducible behaviour that looks wrong
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve PulseOps. Please keep security reports out of public issues.
  - type: input
    id: version
    attributes:
      label: Commit, tag, or release
      description: For example, main or pulseops-01-redis
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the smallest useful reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, .NET SDK, Aspire CLI and container runtime if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traces
      render: shell
